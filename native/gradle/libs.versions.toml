# NG2N 技术栈版本锁(唯一真相源,见 ADR-0004 / research/stack-2026-08.md)。
# 只进 stable,不进 alpha/beta/rc。加库先加进这里,并在票的 Comments 里写理由。
# 2026-08-22 票 01 逐条实查 maven-metadata.xml 复核过一遍(全部为当日最新 stable)。

[versions]
agp = "9.3.1"                       # Gradle wrapper 9.7.1 / JDK 17
kotlin = "2.4.10"
ksp = "2.3.11"                      # KSP 自 2.3.0 起与 Kotlin 版本解耦
composeBom = "2026.08.00"           # core 1.12.0 / material3 1.4.0;强制 compileSdk 37
composeRuntimeTracing = "1.12.0"    # 不在 BOM 里,单独锁
activityCompose = "1.13.0"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
nav3 = "1.1.6"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
okhttp = "5.5.0"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
kotlinxImmutable = "0.5.1"
coil = "3.5.0"
room = "2.8.4"
datastore = "1.2.1"
benchmark = "1.4.1"                 # 运行时库(macrobenchmark);1.5.0-rc01 转正后升
# ⚠ 唯一的非 stable 例外,票 01 被迫:androidx.baselineprofile 1.4.1 的 Gradle 插件走的是
# AGP 老 variant API(`AppExtension.applicationVariants`),AGP 9 已删掉,插件 apply 阶段就抛
# 「Module `:app` is not a supported android module」(字节码实证,见票 01 Comments)。
# 1.5.0-rc01 才改用新 AndroidComponents API。ADR-0004 锁的 AGP 9.3.1 与 Compose BOM
# 2026.08.00(强制 AGP ≥9.1.1)不能退,所以插件先吃 rc,库仍留 1.4.1。
# 1.5.0 转正后把这一行删掉、统一回 benchmark。
baselineprofilePlugin = "1.5.0-rc01"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"
junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"

# SDK / 构建常量(票 01;spec §一)
compileSdk = "37"
targetSdk = "36"
minSdk = "31"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-runtime-tracing = { group = "androidx.compose.runtime", name = "runtime-tracing", version.ref = "composeRuntimeTracing" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-nav3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
nav3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "nav3" }
nav3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "nav3" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-coroutines = { group = "com.squareup.okhttp3", name = "okhttp-coroutines", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
# 票 06:反封锁链的 JVM 单测要真起一个 HTTP 服务端 —— `renewTransport` 换没换连接、
# 自管 CookieJar 有没有把 Cookie 头装上、GBK 表单 Content-Type 有没有原样发出去,
# 这三件事假 Transport 证明不了(它们发生在 okhttp 内部)。5.x 的 artifact 名是
# mockwebserver3(旧的 mockwebserver 是 okhttp3 包名那套),版本跟 okhttp 走。
mockwebserver3 = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinxImmutable" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# AGP 9 内建 Kotlin 支持后不再 apply KGP,`kotlin("test")` 那套按测试框架自动选 flavor 的
# 魔法也随之消失(只有 kotlin.test.assertEquals 能解析,kotlin.test.Test 解析不了)。
# 这里显式锁 JUnit4 flavor。
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
# 票 06:一条回归要断言「NgaRequest.operation 没有默认值」(漏标就会静默走错链),
# 这只能靠 kotlin-reflect 读构造器的 isOptional。仅测试用。
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofilePlugin" }

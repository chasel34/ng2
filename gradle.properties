# 本机 16GB 内存,可能有多个子代理并行构建:堆上限按简报卡死(jvmargs ≤2g / kotlin daemon ≤1536m)。
# metaspace 单列:768m 时 R8 + KSP + Compose 编译器插件一起上会把 daemon 挤爆
# (「Daemon will expire ... out of JVM Metaspace」),1g 实测够;堆仍卡在 2g 不动。
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# 票 60:connected androidTest(含 `generateBaselineProfile` 的
# `:benchmark:connectedNonMinifiedReleaseAndroidTest`)跑完之后,AGP 默认会把
# **被测 app** 连同测试 APK 一起 `pm uninstall`(BooleanOption
# `android.injected.androidTest.leaveApksInstalledAfterRun` 默认 false)。
# 卸载会一并抹掉 /data/data 与 AndroidKeyStore 里的 `ng2n.accounts.v1` 密钥 ——
# 真机上「同签名 install -r 却丢了登录态」就是这么来的：包不是被覆盖,是先被卸了。
# 真机是所有者的日常机、登录态不可再生,这里一律留包。
android.injected.androidTest.leaveApksInstalledAfterRun=true

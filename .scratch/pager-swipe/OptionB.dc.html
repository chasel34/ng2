<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #3A5A7A; } a:hover { color: #14796B; }
    .nosel { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  </style>
</helmet>

<div class="nosel" style="width: 390px; height: 800px; overflow: hidden; background: #FCF4E1; color: #1E1C19; position: relative">

  <div style="background: #14796B">
    <div style="display: flex; align-items: center; height: 54px; padding: 0 4px">
      <div style="width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4"/><path d="M11 5l-7 7 7 7"/></svg>
      </div>
      <div style="max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16.5px; font-weight: 600; color: #FFFFFF">「战报」8.16 挑战首通记录</div>
      <div style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3z"/></svg>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 6px; padding: 0 10px 8px; overflow: hidden">
      <sc-for list="{{chips}}" as="chip" hint-placeholder-count="8">
        <div style="display: flex; align-items: center; gap: 6px">
          <sc-if value="{{chip.gap}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 13px; font-weight: 600; color: #FFFFFF; opacity: 0.5">…</span>
          </sc-if>
          <div style="min-width: 30px; height: 28px; padding: 0 9px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #FFFFFF; background: {{chip.bg}}; opacity: {{chip.opacity}}">{{chip.label}}</div>
        </div>
      </sc-for>
      <div style="display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border-radius: 8px; color: #FFFFFF">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h11"/><path d="M4 11h7"/><path d="M4 16h5"/><path d="M15 13v5"/><path d="M12 15l3 3 3-3"/></svg>
        <span style="font-size: 12.5px; opacity: 0.8">跳页</span>
      </div>
    </div>
  </div>

  <div style="position: relative; height: 710px; overflow: hidden; touch-action: pan-y" onPointerDown="{{ begin }}" onPointerMove="{{ move }}" onPointerUp="{{ end }}" onPointerCancel="{{ end }}">
    <div style="height: 710px; overflow: hidden; will-change: transform; transform: translateX({{ trackX }}); transition: {{ trackTrans }}">
      <sc-for list="{{curFloors}}" as="f" hint-placeholder-count="4">
        <div style="padding: 14px 16px 6px; border-bottom: 1px solid #EBE3CE">
          <div style="display: flex; gap: 11px">
            <div style="width: 42px; height: 42px; border-radius: 21px; flex: 0 0 42px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #FFFFFF; background: {{f.color}}">{{f.initial}}</div>
            <div style="flex: 1; min-width: 0">
              <div style="display: flex; align-items: baseline; gap: 8px">
                <span style="font-size: 15px; font-weight: 600; color: #14796B">{{f.name}}</span>
                <span style="margin-left: auto; font-size: 12px; color: #A39D8E">{{f.time}}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 10px; margin-top: 4px">
                <span style="font-size: 11.5px; color: #A39D8E">{{f.level}}</span>
                <span style="font-size: 11.5px; color: #A39D8E">{{f.prestige}}</span>
                <span style="margin-left: auto; font-size: 11.5px; color: #A39D8E">{{f.no}}</span>
              </div>
            </div>
          </div>
          <div style="margin-top: 11px; font-size: 15.5px; line-height: 26.04px; color: #1E1C19">{{f.body}}</div>
          <div style="display: flex; align-items: center; justify-content: flex-end; gap: 2px; margin-top: 8px; color: #A39D8E">
            <div style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 8px; border-radius: 10px">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M7 10v10H4V10z"/><path d="M7 10l4.2-6.4c.9-1.3 2.8-.7 2.8.9V9h4.3c1.3 0 2.2 1.2 1.9 2.4l-1.6 6.6c-.2 1.2-1.2 2-2.4 2H7z"/></svg>
              <span style="font-size: 13px">{{f.likes}}</span>
            </div>
            <div style="width: 38px; height: 40px; display: flex; align-items: center; justify-content: center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 8V4L3 10l6 6v-4c5 0 8 2 10 6 0-7-4-10-10-10z"/></svg>
            </div>
            <div style="width: 38px; height: 40px; display: flex; align-items: center; justify-content: center">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{hintOpen}}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; pointer-events: none">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 18px 11px; border-radius: 14px; background: {{hintBg}}; box-shadow: 0px 2px 12px rgba(70, 58, 24, 0.13)">
          <div style="font-size: 14px; font-weight: 600; color: #FFFFFF">{{hintText}}</div>
          <div style="width: 96px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.3); overflow: hidden">
            <div style="height: 3px; border-radius: 2px; background: #FFFFFF; width: {{hintFill}}"></div>
          </div>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "commit": {"editor": "range", "default": 25, "min": 10, "max": 50, "step": 1, "unit": "% 屏宽", "section": "翻页阈值"},
  "fling": {"editor": "boolean", "default": true, "section": "翻页阈值"},
  "$preview": {"width": 390, "height": 800}
}'>
const W = 390;
const TOTAL = 12;
const ACTIVATE = 12;
const AXIS = 1.3;
const HINT_AT = 40;
const FLING_V = 0.4;
const FLING_MIN = 24;

const PEOPLE = [
  { name: '风间苍月', initial: '风', color: '#3E6B7E', level: '15 级', prestige: '威望 3.2k' },
  { name: '落雨听禅', initial: '落', color: '#7E5A3E', level: '12 级', prestige: '威望 980' },
  { name: '北岭孤舟', initial: '北', color: '#5A6E3E', level: '18 级', prestige: '威望 7.4k' },
  { name: '半夏微凉', initial: '半', color: '#6E3E5A', level: '9 级', prestige: '威望 410' },
];

const BODIES = {
  2: [
    '开荒那两周的日志我整理了一份,配装和轴都在里面,后面几页会一起贴。',
    '这里补一句:第二阶段的读条比公示的短 0.4 秒,别按公示掐。',
    '当时是拿三号位换的伤害,现在版本没必要了。',
    '先占个楼,晚上回来补图。',
  ],
  3: [
    '首通那晚的录像传网盘了,链接在 32 楼。开荒思路和现在主流打法差挺多,主要是当时还没那个减伤。',
    '楼上链接失效了,补一个。另外提醒一下,第三阶段的仇恨机制在这个版本改过。',
    '当年就是卡在这里两个星期,现在回头看纯属信息差。',
    '存一下,谢谢楼主。',
  ],
  4: [
    '按 41 楼的轴打了一遍,第三阶段确实稳了,团里两个新人也过了。',
    '录像看完,治疗那段的站位是关键,别站在门口。',
    '这帖该置顶,省得每次都有人来问同样的问题。',
    '已收藏。',
  ],
};

const TIMES = ['08-16 21:34', '08-16 22:07', '08-17 00:12', '08-17 08:40'];
const LIKES = ['128', '46', '311', '7'];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { page: 3, dx: 0, mode: 'idle' };
    this.drag = null;
  }

  floorsFor(page) {
    const bodies = BODIES[page] || BODIES[3];
    return PEOPLE.map((person, i) => ({
      name: person.name,
      initial: person.initial,
      color: person.color,
      level: person.level,
      prestige: person.prestige,
      time: TIMES[i],
      likes: LIKES[i],
      no: '#' + ((page - 1) * 20 + i + 1),
      body: bodies[i],
    }));
  }

  chipList(page) {
    const window = new Set([1, TOTAL]);
    for (let v = page - 4; v <= page + 4; v += 1) {
      if (v >= 1 && v <= TOTAL) window.add(v);
    }
    const list = [...window].sort((a, b) => a - b);
    return list.map((value, index) => ({
      label: String(value),
      gap: index > 0 && value - list[index - 1] > 1,
      bg: value === page ? 'rgba(255,255,255,0.22)' : 'transparent',
      opacity: value === page ? '1' : '0.62',
    }));
  }

  offsetFor(dx) {
    const page = this.state.page;
    const atEdge = (dx > 0 && page <= 1) || (dx < 0 && page >= TOTAL);
    return dx * (atEdge ? 0.25 : 0.7);
  }

  renderVals() {
    const page = this.state.page;
    const dx = this.state.dx;
    const distance = W * ((this.props.commit ?? 25) / 100) * 0.7;
    const dir = dx < 0 ? 1 : -1;
    const target = page + dir;
    const dragging = this.state.mode === 'drag';
    const open = dragging && Math.abs(dx) > HINT_AT * 0.7;
    const reached = Math.abs(dx) > distance;
    let text = '第 ' + target + ' 页';
    if (target < 1) text = '已是第一页';
    else if (target > TOTAL) text = '已是最后一页';
    else if (reached) text = '松手翻到第 ' + target + ' 页';
    const blocked = target < 1 || target > TOTAL;

    return {
      trackX: Math.round(dx) + 'px',
      trackTrans: dragging || this.state.mode === 'idle' ? 'none' : 'transform .22s cubic-bezier(.2,.8,.3,1)',
      chips: this.chipList(page),
      curFloors: this.floorsFor(page),
      hintOpen: open,
      hintText: text,
      hintBg: blocked ? 'rgba(30, 26, 16, 0.42)' : reached ? '#14796B' : 'rgba(30, 26, 16, 0.42)',
      hintFill: blocked ? '0%' : Math.round(Math.min(1, Math.abs(dx) / distance) * 100) + '%',
      begin: (e) => {
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* 桌面浏览器没有指针捕获也不影响 */ }
        this.drag = { x: e.clientX, y: e.clientY, lx: e.clientX, lt: e.timeStamp, v: 0, claimed: false };
      },
      move: (e) => {
        const d = this.drag;
        if (d === null) return;
        const mx = e.clientX - d.x;
        const my = e.clientY - d.y;
        if (!d.claimed) {
          if (Math.abs(mx) < ACTIVATE || Math.abs(mx) <= Math.abs(my) * AXIS) return;
          d.claimed = true;
        }
        const dt = e.timeStamp - d.lt;
        if (dt > 0) d.v = (e.clientX - d.lx) / dt;
        d.lx = e.clientX;
        d.lt = e.timeStamp;
        this.setState({ mode: 'drag', dx: this.offsetFor(mx) });
      },
      end: () => {
        const d = this.drag;
        this.drag = null;
        if (d === null || !d.claimed) return;
        const moved = this.state.dx;
        const way = moved < 0 ? 1 : -1;
        const to = this.state.page + way;
        const reach = Math.abs(moved) > distance;
        const flung = (this.props.fling ?? true) && Math.abs(d.v) > FLING_V && Math.abs(moved) > FLING_MIN * 0.7;
        if (to >= 1 && to <= TOTAL && (reach || flung)) {
          this.setState({ mode: 'idle', page: to, dx: 0 });
          return;
        }
        this.setState({ mode: 'settle', dx: 0 });
      },
    };
  }
}
</script>
</body>
</html>
